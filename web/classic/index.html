<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      lang="zh"
      content="统一的 AI 模型聚合与分发网关，支持将各类大语言模型跨格式转换为 OpenAI、Claude、Gemini 兼容接口，为个人与企业提供集中式模型管理与网关服务。"
    />
    <meta
      name="description"
      lang="en"
      content="A unified AI model hub for aggregation & distribution. It supports cross-converting various LLMs into OpenAI-compatible, Claude-compatible, or Gemini-compatible formats. A centralized gateway for personal and enterprise model management."
    />
    <meta name="generator" content="new-api" />
    <title>New API</title>
    <script>
      ;(() => {
        try {
          const readStatus = () => {
            try {
              const savedStatus = localStorage.getItem('status')
              return savedStatus ? JSON.parse(savedStatus) : null
            } catch {
              return null
            }
          }
          const status = readStatus()
          const readLogo = (value) => {
            if (typeof value !== 'string') return null
            const normalized = value.trim()
            if (
              !normalized ||
              normalized === 'undefined' ||
              normalized === 'null'
            ) {
              return null
            }
            return normalized
          }
          const systemName =
            localStorage.getItem('system_name') || status?.system_name
          const logo =
            readLogo(localStorage.getItem('logo')) || readLogo(status?.logo)
          if (systemName) document.title = systemName
          const icon = document.querySelector('link[rel~="icon"]')
          if (icon) icon.href = logo || '/favicon.ico'
        } catch {}
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
